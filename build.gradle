plugins {
    id 'com.android.application' version '8.5.2' apply false
    id 'com.android.library' version '8.5.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
}

subprojects {
    configurations.configureEach {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
            force 'androidx.activity:activity:1.9.3'
            force 'androidx.activity:activity-ktx:1.9.3'
            force 'androidx.recyclerview:recyclerview:1.3.2'
            force 'androidx.appcompat:appcompat:1.7.0'
            force 'androidx.appcompat:appcompat-resources:1.7.0'
            force 'androidx.lifecycle:lifecycle-runtime:2.8.7'
            force 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
            force 'androidx.lifecycle:lifecycle-common:2.8.7'
            force 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
            force 'androidx.lifecycle:lifecycle-livedata-core:2.8.7'
            force 'com.squareup.okhttp3:okhttp:4.12.0'
            force 'com.squareup.okio:okio:3.6.0'
            force 'com.github.bumptech.glide:glide:4.16.0'
            force 'com.github.bumptech.glide:gifdecoder:4.16.0'
            force 'com.github.bumptech.glide:disklrucache:4.16.0'
        }
    }
}
